services:
  # No auth, no published port, no volume: mongod is reachable only from the
  # compose network, so credentials would protect nothing, and the data dies
  # with the container - which is what you want in dev.
  db:
    image: mongo:8
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: url-shortener
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_DB_URL: mongodb://db:27017/urlshortener
      BASE_URL: http://127.0.0.1:3000
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
